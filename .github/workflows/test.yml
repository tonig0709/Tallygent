name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  release-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build universal panel app
        run: |
          xcodebuild \
            -project CodexQuotaWidget.xcodeproj \
            -scheme CodexQuota \
            -configuration Release \
            -derivedDataPath "$PWD/build" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Apply ad-hoc signature
        run: |
          app="$PWD/build/Build/Products/Release/Codex Quota.app"
          codesign --force --sign - \
            --entitlements App/CodexQuota.entitlements "$app"

      - name: Package test DMG
        run: |
          app="$PWD/build/Build/Products/Release/Codex Quota.app"
          mkdir "$PWD/dmg-root"
          /usr/bin/ditto "$app" "$PWD/dmg-root/Codex Quota.app"
          ln -s /Applications "$PWD/dmg-root/Applications"
          hdiutil create -volname "Codex Quota" -srcfolder "$PWD/dmg-root" \
            -ov -format UDZO "$PWD/Codex-Quota-test.dmg"

      - name: Run release bug gate
        env:
          CODEX_QUOTA_ISOLATED_REGISTRY: "1"
        run: |
          ./scripts/release-preflight.sh \
            "$PWD/build/Build/Products/Release/Codex Quota.app" \
            "$PWD/Codex-Quota-test.dmg"

      - name: Upload local test DMG
        if: github.event_name == 'workflow_dispatch' && matrix.os == 'macos-26'
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Quota-local-macOS
          path: Codex-Quota-test.dmg
          retention-days: 7
